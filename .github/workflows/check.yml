name: Package checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Check out the supported public mapper
        uses: actions/checkout@v4
        with:
          repository: LotJ/lotj-mudlet-ui
          ref: dc6ae9c471c6aa8e4dcfdb4814b79a4cc0c3753c
          path: .upstream-ui
          persist-credentials: false
      - name: Test package and public mapper compatibility
        env:
          LUA: luajit
          LOTJ_MAPPER_SOURCE: .upstream-ui/src/scripts/mapper/mapper.lua
        run: python3 -m unittest discover -s tests -v
      - name: Verify the downloadable package matches its sources
        run: |
          python3 scripts/build.py --output /tmp/lotj-doorways.mpackage
          cmp 'LotJ Doorways.mpackage' /tmp/lotj-doorways.mpackage
